[package]
name = "tidyflow-app"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "tidyflow-app"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tidyflow-core = { path = "../core" }

[build-dependencies]
tauri-build = "2.7.4"

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Build de produção: carrega ui/dist embutido em vez do servidor do Vite.
custom-protocol = ["tauri/custom-protocol"]
