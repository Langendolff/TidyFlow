[package]
name = "tidyflow-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
globset = "0.4.21"
infer = "0.22.0"
mime_guess = "2.0.5"
regex = "1.13.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
trash = "5.3.0"
xattr = "1.7.0"

[dev-dependencies]
tempfile = "3.27.0"
