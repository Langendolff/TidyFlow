[package]
name = "tidyflow-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
globset = "0.4.21"
infer = "0.22.0"
mime_guess = "2.0.5"
regex = "1.13.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
toml_edit = "0.25.19"
trash = "5.3.0"

[target.'cfg(unix)'.dependencies]
xattr = "1.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
