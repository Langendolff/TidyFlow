[package]
name = "tidyflow"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.2"
notify-rust = "4.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tidyflow-core = { path = "../core" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xattr = "1.7.0"

[dev-dependencies]
tempfile = "3.27.0"
